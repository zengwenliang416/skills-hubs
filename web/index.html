<!doctype html>
<html lang="zh-CN" data-amicro-root>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Skills Hub — 精心打造的 Agent 技能集" />
    <title>Skills Hub — 精心打造的 Agent 技能集</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23171717'/%3E%3Crect x='7' y='7' width='18' height='13' rx='4' fill='none' stroke='%23f5f5f5' stroke-width='2'/%3E%3Ccircle cx='16' cy='24.5' r='1.6' fill='%23f5f5f5'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the persisted theme before first paint to avoid a theme flash.
      // Keep in sync with STORAGE_KEY in src/lib/theme.tsx.
      ;(function () {
        var theme = 'auto'
        try {
          var saved = window.localStorage.getItem('skills-hub-theme')
          if (saved === 'light' || saved === 'dark' || saved === 'auto') {
            theme = saved
          }
        } catch (error) {
          // Storage may be unavailable (private mode); fall back to auto.
        }
        document.documentElement.setAttribute('data-amicro-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
