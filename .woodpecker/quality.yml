clone:
  git:
    image: woodpeckerci/plugin-git:2.9.2@sha256:a36586dfe77e9c5d9b5bff3ad37f18158eb12036aa9e9908e2e813ee6029573e
    settings:
      partial: false
      depth: 0

labels:
  location: production-80
  platform: linux/amd64
  backend: docker

when:
  - event: pull_request
  - event: push
    branch: main
  - event: tag
  - event: manual

concurrency:
  limit: 1
  group: skills-hubs-quality

steps:
  - name: verify-repository
    image: node:24-bookworm@sha256:107ceb6ad85808049dccef12414bf17b08eceb299eaf755c0339dc5fc8958d6b
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends ca-certificates git python3
      - python3 scripts/ci/verify_repository.py
